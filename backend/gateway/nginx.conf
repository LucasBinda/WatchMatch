# Gateway: a única porta aberta do WatchMatch (docs/ARQUITETURA.md, seção 5).
# Roteia o site e a /api, limita buscas por IP, limita o tamanho do corpo e gera o X-Request-Id.
# Só as rotas listadas aqui são públicas; /discover, /titles/lookup e o llm-service ficam na rede interna.

# --- Rate limit (modelo "por IP + teto global") ---
# Contam pedidos, não tokens. Os números protegem a cota gratuita do Groq: cada busca no modo
# "pick" faz 2 chamadas à IA. Folga (burst) = cliques seguidos aceitos antes de recusar.
#   recommend_ip:  6 buscas/min por IP, folga 4   → um abusador não gasta a cota diária de todos
#   recommend_all: 20 buscas/min no site todo, folga 10 → teto que acompanha a cota do Groq
#   api_ip:        10 pedidos/s por IP no resto da /api (sem IA, só catálogo)
# 10m guardam ~160 mil IPs; $server_name é igual para todos, então vira um contador só.
limit_req_zone $binary_remote_addr zone=recommend_ip:10m rate=6r/m;
limit_req_zone $server_name        zone=recommend_all:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;

# --- IP real atrás de um proxy (deploy) ---
# Na produção o túnel da Cloudflare fica na frente e o Nginx enxergaria só o IP dele: todo mundo cairia no mesmo limite.
# O docker-compose.prod.yml monta deploy/real-ip.conf, que usa o CF-Connecting-IP repassado pelo túnel.

server {
    listen 80;
    server_name watchmatch;

    client_max_body_size 16k;

    # Destinos resolvidos pelo DNS do Docker a cada 10 s, não uma vez só na partida. Com o nome fixo no
    # proxy_pass, o nginx guardava o IP da partida: recriar um container (docker compose up --build) mudava
    # o IP dele e o gateway seguia mandando para o antigo, com 502, até ser reiniciado. Com variável no
    # proxy_pass, o nginx pergunta de novo ao resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $recommendation recommendation-service:8082;
    set $catalog catalog-service:8081;
    set $frontend frontend:80;

    limit_req_status 429;
    limit_req_log_level warn;

    # Rastreamento: cada pedido ganha um X-Request-Id que os serviços repassam entre si
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Os serviços já devolvem o X-Request-Id; o gateway só o põe nas respostas que ele mesmo gera (429, 413)

    # Erros do próprio gateway no mesmo formato dos serviços (application/problem+json)
    error_page 429 @too_many_requests;
    error_page 413 @too_large;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/recommend {
        limit_except POST { deny all; }
        limit_req zone=recommend_ip burst=4 nodelay;
        limit_req zone=recommend_all burst=10 nodelay;
        proxy_pass http://$recommendation/recommend;
        # Com 48 títulos a IA pode levar ~40 s
        proxy_read_timeout 60s;
    }

    location = /api/meta {
        limit_except GET { deny all; }
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://$catalog/meta;
    }

    # /api/titles/movie/123 → /titles/movie/123 (o /lookup é interno: só número no id)
    location ~ ^/api/titles/(movie|tv)/([0-9]+)$ {
        limit_except GET { deny all; }
        limit_req zone=api_ip burst=20 nodelay;
        proxy_pass http://$catalog/titles/$1/$2;
    }

    # Qualquer outra rota da API não existe para fora
    location /api/ {
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not Found","detail":"Rota inexistente."}';
    }

    # O resto é o site, servido pelo container do frontend
    location / {
        # Com variável e sem caminho, o nginx repassa o caminho pedido como veio
        proxy_pass http://$frontend;
    }

    location @too_many_requests {
        default_type application/problem+json;
        # 6 buscas/min = uma nova a cada 10 s
        add_header Retry-After 10 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"status":429,"title":"Too Many Requests","detail":"Muitas buscas seguidas. Espere alguns segundos e tente de novo."}';
    }

    location @too_large {
        default_type application/problem+json;
        add_header X-Request-Id $request_id always;
        return 413 '{"status":413,"title":"Payload Too Large","detail":"Pedido grande demais."}';
    }
}
