# Só na produção (docker-compose.prod.yml monta este arquivo no gateway).
# Atrás do túnel da Cloudflare, todo pedido chega com o IP do container do túnel, e o rate limit por IP
# viraria um limite só para o site inteiro. Aqui o Nginx passa a usar o CF-Connecting-IP, que a Cloudflare
# preenche com o IP de quem acessou (e sobrescreve se o visitante mandar um falso). Só vale para pedidos da
# rede interna do Compose (faixa fixa no docker-compose.prod.yml): de fora, ninguém alcança o gateway direto.
set_real_ip_from 172.30.0.0/24;
real_ip_header CF-Connecting-IP;
