# Só na produção (docker-compose.prod.yml monta este arquivo no gateway).
# Atrás do Caddy, todo pedido chega com o IP do Caddy, e o rate limit por IP viraria um limite só para o
# site inteiro. Aqui o Nginx passa a usar o IP do X-Forwarded-For, mas só quando o pedido vem da rede
# interna do Compose (faixa fixa no docker-compose.prod.yml): de fora, ninguém alcança o gateway direto.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
