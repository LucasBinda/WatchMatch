# Produção (docs/DEPLOY.md): soma-se ao docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# ou só deploy/deploy.sh, que também mostra o endereço público.
#
# O que muda em relação ao de casa:
#  - um túnel da Cloudflare (cloudflared) publica o site com HTTPS num endereço *.trycloudflare.com,
#    sem abrir porta nenhuma no computador nem no roteador: o túnel sai daqui para a Cloudflare;
#  - o gateway deixa de abrir a 8080 e usa o IP real do visitante que a Cloudflare repassa (deploy/real-ip.conf);
#  - cada container tem teto de memória, para os três Java não tomarem a máquina;
#  - os logs giram (até 3 arquivos de 10 MB por container) para não encher o disco.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# A JVM usa até 75% do teto do container (o padrão seria só 25%)
x-java: &java
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

services:
  catalog-service:
    environment:
      <<: *java
    mem_limit: 640m
    logging: *logging
    restart: unless-stopped

  llm-service:
    environment:
      <<: *java
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  recommendation-service:
    environment:
      <<: *java
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  frontend:
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  gateway:
    # Sem porta para fora: só o túnel fala com o gateway
    ports: !reset []
    volumes:
      - ./deploy/real-ip.conf:/etc/nginx/conf.d/real-ip.conf:ro
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    # Túnel rápido: não precisa de conta. O endereço é sorteado e muda toda vez que o túnel reinicia.
    command: tunnel --no-autoupdate --url http://gateway:80
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

# Faixa fixa da rede interna: o gateway só aceita o IP repassado vindo daqui (deploy/real-ip.conf)
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
