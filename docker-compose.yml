# Sobe o WatchMatch inteiro: docker compose up --build  →  http://localhost:8080
# Cada serviço roda no seu container; só o gateway tem porta aberta para fora.
# O gateway (Nginx) repassa o site ao frontend e a /api aos serviços, com rate limit por IP.
# As chaves vêm de backend/.env (copie de backend/.env.example).
#
# build.network: host — o build baixa Maven e npm usando a rede do computador. Na rede padrão do build,
# o Docker copia o DNS do computador; se ele só tiver servidores IPv6 (comum em provedores brasileiros),
# o build não resolve nomes e o ./mvnw falha com "wget: Failed to fetch".

# Cada serviço Java responde GET /health quando está de pé; o Compose só sobe quem depende dele depois disso.
# O Spring leva alguns segundos para iniciar: start_period dá esse tempo sem contar como falha.
x-health-timing: &health-timing
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 40s
  start_interval: 2s

services:
  catalog-service:
    build:
      context: ./backend/catalog-service
      network: host
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      <<: *health-timing
    restart: unless-stopped

  llm-service:
    build:
      context: ./backend/llm-service
      network: host
    env_file:
      - path: ./backend/.env
        required: false
    # Versão do prompt do /intent. Não é segredo, por isso fica aqui e não no .env. Para o eval comparar:
    # LLM_INTENT_PROMPT=intent.v2 docker compose up -d llm-service
    environment:
      LLM_INTENT_PROMPT: ${LLM_INTENT_PROMPT:-intent.v3}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      <<: *health-timing
    restart: unless-stopped

  recommendation-service:
    build:
      context: ./backend/recommendation-service
      network: host
    environment:
      CATALOG_URL: http://catalog-service:8081
      LLM_URL: http://llm-service:8083
    depends_on:
      catalog-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      <<: *health-timing
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
    # O Nginx da imagem alpine tem wget (busybox), não curl. 127.0.0.1: o nginx.conf só escuta IPv4
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      <<: *health-timing
    restart: unless-stopped

  gateway:
    build:
      context: ./backend/gateway
    ports:
      - "8080:80"
    # O Nginx confere na partida se os nomes dos destinos existem: só sobe depois de todos
    depends_on:
      catalog-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      <<: *health-timing
    restart: unless-stopped
