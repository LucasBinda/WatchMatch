# Site + roteamento de /api, no lugar do gateway enquanto ele não existe (docs/ARQUITETURA.md, seção 5).
# Mesmas regras do proxy em vite.config.ts: /api/recommend → recommendation-service, o resto → catalog-service.
server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 16k;

    # Rastreamento: cada pedido ganha um X-Request-Id que os serviços repassam entre si
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;

    location = /api/recommend {
        proxy_pass http://recommendation-service:8082/recommend;
        # Com 48 títulos a IA pode levar ~40 s
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://catalog-service:8081/;
    }

    # O site é uma página só: qualquer outro caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
