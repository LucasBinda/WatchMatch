# Só serve o site estático. A /api e o rate limit ficam no gateway (backend/gateway/nginx.conf),
# que é a única porta aberta e repassa para cá tudo o que não é /api.
server {
    listen 80;
    root /usr/share/nginx/html;

    # O site é uma página só: qualquer outro caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
