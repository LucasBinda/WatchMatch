<!doctype html>
<!-- Link fixo do WatchMatch (docs/DEPLOY.md). O deploy/deploy.sh preenche o endereço do túnel e a data
     e publica esta página na branch gh-pages; o GitHub Pages a serve em https://lucasbinda.github.io/notComplete/.
     Antes de redirecionar, a página confere se o site está no ar: carrega o ícone do site como imagem (imagem
     de outro domínio não esbarra no CORS). Carregou: redireciona. Não carregou em 8 s (túnel caído, computador
     desligado, ou "deploy/deploy.sh parar", que publica a página sem endereço): mostra que está fora do ar. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WatchMatch</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: hsl(235 22% 6%);
        color: hsl(235 25% 93%);
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      a { color: hsl(335 80% 64%); }
      small { color: hsl(235 14% 66%); }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>WatchMatch</h1>
      <p id="checking">Abrindo o site…</p>
      <div id="offline" hidden>
        <p>O WatchMatch está fora do ar agora.</p>
        <p><small>O site roda no computador da equipe e só fica no ar durante as apresentações. Tente mais tarde.</small></p>
      </div>
      <noscript><p>Sem JavaScript: <a href="">tente abrir o site</a>.</p></noscript>
      <p><small>Última publicação: 25/11/2026 11:43.</small></p>
    </main>
    <script>
      const site = ''
      const offline = () => {
        document.getElementById('checking').hidden = true
        document.getElementById('offline').hidden = false
      }
      if (!site.startsWith('https://')) {
        offline()
      } else {
        const probe = new Image()
        const timer = setTimeout(offline, 8000)
        probe.onload = () => {
          clearTimeout(timer)
          location.replace(site)
        }
        probe.onerror = () => {
          clearTimeout(timer)
          offline()
        }
        probe.src = `${site}/favicon.svg?agora=${Date.now()}`
      }
    </script>
  </body>
</html>
